<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>Beryl</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1210; color: #eef4f0; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
      main { width: min(26rem, calc(100vw - 3rem)); }
      svg { display: block; border-radius: 14px; }
      h1 { margin: 1.4rem 0 0.35rem; font: 600 1.6rem/1.2 -apple-system, "Segoe UI", system-ui, sans-serif; letter-spacing: -0.03em; }
      p { margin: 0 0 1.1rem; color: #a4b3ab; }
      label { display: block; margin-bottom: 0.4rem; font-size: 0.8rem; color: #a4b3ab; }
      input { width: 100%; height: 2.6rem; padding: 0 0.85rem; border-radius: 0.8rem; border: 1px solid #26332d; background: #121a17; color: inherit; font: inherit; outline: none; }
      input:focus { border-color: #7fdcb4; }
      .row { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
      button { height: 2.5rem; padding: 0 1.1rem; border-radius: 999px; border: 1px solid #26332d; background: #121a17; color: inherit; font: 500 0.9rem/1 inherit; cursor: pointer; }
      button.primary { border-color: transparent; background: #7fdcb4; color: #06281c; }
      button:hover { filter: brightness(1.08); }
      .note { margin-top: 0.9rem; min-height: 1.3rem; font-size: 0.8rem; color: #e4b363; }
    </style>
  </head>
  <body>
    <main>
      <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#62d8a6" />
        <path fill="#03160f" opacity="0.62" d="M16.42 5.81 24.62 10.55 21.01 12.62 16.42 9.97Z" />
        <path fill="#03160f" opacity="0.4" d="M25.03 11.27 25.03 20.73 21.43 18.66 21.43 13.34Z" />
        <path fill="#03160f" opacity="0.4" d="M24.62 21.45 16.42 26.19 16.42 22.03 21.01 19.38Z" />
        <path fill="#03160f" opacity="0.62" d="M15.58 26.19 7.38 21.45 10.99 19.38 15.58 22.03Z" />
        <path fill="#03160f" opacity="0.92" d="M6.97 20.73 6.97 11.27 10.57 13.34 10.57 18.66Z" />
        <path fill="#03160f" opacity="0.92" d="M7.38 10.55 15.58 5.81 15.58 9.97 10.99 12.62Z" />
        <path fill="#03160f" d="M16.00 11.60 19.81 13.80 19.81 18.20 16.00 20.40 12.19 18.20 12.19 13.80Z" />
      </svg>
      <h1>Beryl cannot reach its server</h1>
      <p>Check your connection and try again. If your Beryl runs at another address, enter it here.</p>
      <label for="address">Server address</label>
      <input id="address" spellcheck="false" autocapitalize="off" autocomplete="off" />
      <div class="row">
        <button class="primary" id="retry">Try again</button>
        <button id="save">Use this address</button>
      </div>
      <div class="note" id="note" role="status"></div>
    </main>
    <script>
      const shell = window.berylShell;
      const address = document.getElementById("address");
      const note = document.getElementById("note");
      let current = "";
      shell.server().then((value) => { current = value || ""; address.value = current; });
      document.getElementById("retry").addEventListener("click", () => { note.textContent = "Trying again…"; shell.retry(); });
      const save = async () => {
        if (address.value.trim() === current) { note.textContent = "Trying again…"; shell.retry(); return; }
        const ok = await shell.setServer(address.value.trim());
        if (!ok) note.textContent = "That does not look like an address. It should be like https://beryl.example.com";
      };
      document.getElementById("save").addEventListener("click", save);
      address.addEventListener("keydown", (event) => { if (event.key === "Enter") save(); });
    </script>
  </body>
</html>
