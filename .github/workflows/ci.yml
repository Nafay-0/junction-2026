name: CI

# Only when AimoPilot's own folder (or this workflow) changes: the repository also holds the Exa project in exa/.
# Pushes to main and pull requests only. Work branches (claude/**) used to run it too: a branch cut before a fix on
# main failed for that old reason and mailed the owner each time, which hid the failures that mattered.
on:
  push:
    branches: [main]
    paths:
      - "valio-aimo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "valio-aimo/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Lint, typecheck, test, build
    # Runs on CRACI runners (GitHub Actions compatible). SBOM generation is automatic there.
    runs-on: craci
    timeout-minutes: 15
    defaults:
      run:
        working-directory: valio-aimo/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: valio-aimo/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: valio-aimo/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # What CRACI records about this build (where its SBOM is), served by the app at /build-record.json.
      - run: pnpm build:record
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm build

      # The scripted buyer: the milk order end to end, then the misbehaviour attempts.
      # Fails the build if any attempt is not refused.
      - run: pnpm demo
